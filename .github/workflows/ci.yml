name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch: a new push supersedes the in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check src tests

      - name: Train model
        run: python -m src.train

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mlops-churn-prediction:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name smoke -p 8000:8000 mlops-churn-prediction:${{ github.sha }}
          # Poll until the container answers /health rather than guessing at a sleep.
          deadline=$((SECONDS + 60))
          until curl --fail --silent http://localhost:8000/health; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Container did not become healthy within 60s"
              docker logs smoke
              docker stop smoke
              exit 1
            fi
            sleep 2
          done
          docker stop smoke

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          docker tag mlops-churn-prediction:${{ github.sha }} ghcr.io/yigitliman/churn-prediction:latest
          docker tag mlops-churn-prediction:${{ github.sha }} ghcr.io/yigitliman/churn-prediction:${{ github.sha }}
          docker push ghcr.io/yigitliman/churn-prediction:latest
          docker push ghcr.io/yigitliman/churn-prediction:${{ github.sha }}
